name: Release MeiMap v0.2.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check main process syntax
        run: node --check src/main.cjs

      - name: Build portable executable
        run: npm run dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $asset) { throw "Portable EXE was not generated." }
          gh release create v0.2.1 "$($asset.FullName)" --target $env:GITHUB_SHA --title "MeiMap v0.2.1" --notes "途经点输入和提交上限提高到 24 个；Google Maps 网页实际接受的数量仍可能受平台限制。本版尚未加入 iPhone Duo 显示模式。" --latest
