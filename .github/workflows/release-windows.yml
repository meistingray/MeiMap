name: Release MeiMap v0.2.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check main process syntax
        run: node --check src/main.cjs

      - name: Build portable executable
        run: npm run dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $asset) { throw "Portable EXE was not generated." }
          gh release create v0.2.0 "$($asset.FullName)" --target $env:GITHUB_SHA --title "MeiMap v0.2.0" --notes "新增地点或坐标形式的模拟位置设置；路线调整为当前位置、最多九个途经点和目的地的自然顺序；新增电量模拟、完整窗口截图和自定义截图目录；改进 MeiMap 地图标识，并加入版权与地点搜索来源信息。" --latest
