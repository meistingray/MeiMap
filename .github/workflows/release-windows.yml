name: Release MeiMap v0.3.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-windows.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Check main process syntax
        run: |
          node --check src/main.cjs
          node --check src/preload.cjs
          node --check src/map-preload.cjs
          node --check src/renderer.js

      - name: Build portable executable
        run: npm run dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = Get-ChildItem -Path dist -Filter *.exe | Select-Object -First 1
          if (-not $asset) { throw "Portable EXE was not generated." }
          gh release create v0.3.3 "$($asset.FullName)" --target $env:GITHUB_SHA --title "MeiMap v0.3.3" --notes "新增收藏页的手机竖屏／Duo 展开横屏切换；地图铺满窗口，采用浮动导航与模拟状态图形；修复搜索框外围白底；统一隐藏横竖屏路线设置、交通方式、到达时间、开始按钮和推广遮罩，保留地图与驾车路线。已验证长短路线场景。Duo 图形为模拟绘制。" --latest
